<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF → PPTX — Test Harness</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --error: #dc2626;
    --code-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem 1rem;
    line-height: 1.5;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 2rem;
    font-size: 0.9rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .card h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .drop-zone:hover,
  .drop-zone.dragging {
    border-color: var(--accent);
    background: #eff6ff;
  }
  .drop-zone p {
    margin: 0;
    color: var(--muted);
  }
  .drop-zone strong { color: var(--text); }
  input[type="file"] { display: none; }
  .file-info {
    display: none;
    background: var(--code-bg);
    border-radius: 6px;
    padding: 0.625rem 0.875rem;
    margin-top: 0.75rem;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.85rem;
  }
  .file-info.visible { display: block; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.875rem;
  }
  .row:last-child { margin-bottom: 0; }
  .row label {
    font-size: 0.9rem;
    min-width: 6.5rem;
  }
  .row .value {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.85rem;
    color: var(--muted);
    min-width: 4rem;
    text-align: right;
  }
  .toggle-group {
    display: flex;
    background: var(--code-bg);
    border-radius: 6px;
    padding: 0.2rem;
    gap: 0.2rem;
  }
  .toggle-group button {
    border: none;
    background: transparent;
    padding: 0.4rem 0.875rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--muted);
    transition: all 0.15s ease;
  }
  .toggle-group button.active {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.7rem 1.25rem;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s ease;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled {
    background: #a1a1aa;
    cursor: not-allowed;
  }
  .progress {
    display: none;
    margin-top: 0.875rem;
  }
  .progress.visible { display: block; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--code-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 0.5rem;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s ease;
    width: 0%;
  }
  .progress-text {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .results {
    display: none;
  }
  .results.visible { display: block; }
  .results.error .stats { color: var(--error); }
  .stats {
    background: var(--code-bg);
    border-radius: 6px;
    padding: 0.875rem;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.85rem;
    margin-bottom: 0.875rem;
    white-space: pre-wrap;
  }
  a.download {
    display: block;
    text-align: center;
    background: var(--success);
    color: white;
    text-decoration: none;
    padding: 0.7rem 1.25rem;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  a.download:hover { background: #15803d; }
  .quality-row { transition: opacity 0.15s ease; }
  .quality-row.disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
<div class="container">
  <h1>PDF → PPTX Test Harness</h1>
  <p class="subtitle">Each page becomes one slide containing the rendered page image. Everything runs in your browser.</p>

  <div class="card">
    <h2>1. Choose PDF</h2>
    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="application/pdf">
      <p><strong>Click to choose</strong> or drag a PDF file here</p>
    </label>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <div class="card">
    <h2>2. Settings</h2>
    <div class="row">
      <label>Format</label>
      <div class="toggle-group" id="formatToggle">
        <button data-format="png" class="active">PNG (lossless)</button>
        <button data-format="jpeg">JPEG (smaller)</button>
      </div>
    </div>
    <div class="row">
      <label>Scale</label>
      <input type="range" id="scaleSlider" min="1" max="4" step="0.5" value="2">
      <span class="value" id="scaleValue">2× (≈144 DPI)</span>
    </div>
    <div class="row quality-row disabled" id="qualityRow">
      <label>JPEG quality</label>
      <input type="range" id="qualitySlider" min="0.5" max="1" step="0.05" value="0.85">
      <span class="value" id="qualityValue">0.85</span>
    </div>
  </div>

  <div class="card">
    <h2>3. Convert</h2>
    <button class="primary" id="convertBtn" disabled>Convert to PPTX</button>
    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="progress-text" id="progressText">Starting…</div>
    </div>
  </div>

  <div class="card results" id="results">
    <h2>4. Result</h2>
    <div class="stats" id="stats"></div>
    <a class="download" id="downloadLink">⬇ Download PPTX</a>
  </div>
</div>

<!-- Load PDF.js and fflate from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script>
// Configure PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Grab fflate's exports from the UMD global
const { zip: fflateZip, strToU8 } = fflate;

// ════════════════════════════════════════════════════════════════════════
// pdfToPptx — inlined from the module (uses window.fflate, window.pdfjsLib)
// ════════════════════════════════════════════════════════════════════════

const EMU_PER_POINT = 12700;

// Promisified fflate.zip — runs in a Web Worker, keeps UI responsive
function zipAsync(files, opts = {}) {
  return new Promise((resolve, reject) => {
    fflateZip(files, opts, (err, data) => (err ? reject(err) : resolve(data)));
  });
}

function toU8(x) {
  if (x instanceof Uint8Array) return x;
  if (x instanceof ArrayBuffer) return new Uint8Array(x);
  if (ArrayBuffer.isView(x)) return new Uint8Array(x.buffer, x.byteOffset, x.byteLength);
  throw new TypeError('Image must be ArrayBuffer or Uint8Array');
}

async function pdfToPptx(pdfFile, { scale = 2, format = 'png', quality = 0.85, onProgress } = {}) {
  if (format !== 'png' && format !== 'jpeg') {
    throw new Error(`Unsupported format: ${format}`);
  }
  const mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';

  const data = await pdfFile.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const numPages = pdf.numPages;

  const pages = [];
  for (let i = 1; i <= numPages; i++) {
    const page = await pdf.getPage(i);
    const natural = page.getViewport({ scale: 1 });
    const render = page.getViewport({ scale });

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(render.width);
    canvas.height = Math.ceil(render.height);
    const ctx = canvas.getContext('2d');

    if (format === 'jpeg') {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    await page.render({ canvasContext: ctx, viewport: render }).promise;

    const blob = await new Promise((res) =>
      canvas.toBlob(res, mimeType, format === 'jpeg' ? quality : undefined)
    );
    pages.push({
      image: await blob.arrayBuffer(),
      widthPt: natural.width,
      heightPt: natural.height,
    });

    page.cleanup();
    onProgress?.({ phase: 'render', current: i, total: numPages });
  }

  return buildPptxFromImages(pages, { format, onProgress });
}

async function buildPptxFromImages(pages, { format = 'png', onProgress } = {}) {
  if (!pages?.length) throw new Error('No pages provided');
  const n = pages.length;
  const ext = format;
  const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
  const cx = Math.round(pages[0].widthPt * EMU_PER_POINT);
  const cy = Math.round(pages[0].heightPt * EMU_PER_POINT);

  const files = {
    '[Content_Types].xml':                          strToU8(contentTypesXml(n, ext, mime)),
    '_rels/.rels':                                  strToU8(topRelsXml()),
    'ppt/presentation.xml':                         strToU8(presentationXml(n, cx, cy)),
    'ppt/_rels/presentation.xml.rels':              strToU8(presentationRelsXml(n)),
    'ppt/theme/theme1.xml':                         strToU8(themeXml()),
    'ppt/slideMasters/slideMaster1.xml':            strToU8(slideMasterXml()),
    'ppt/slideMasters/_rels/slideMaster1.xml.rels': strToU8(slideMasterRelsXml()),
    'ppt/slideLayouts/slideLayout1.xml':            strToU8(slideLayoutXml()),
    'ppt/slideLayouts/_rels/slideLayout1.xml.rels': strToU8(slideLayoutRelsXml()),
  };

  for (let i = 0; i < n; i++) {
    const idx = i + 1;
    // PNG/JPEG are already compressed → store-only (level: 0) saves CPU
    files[`ppt/media/image${idx}.${ext}`] = [toU8(pages[i].image), { level: 0 }];
    files[`ppt/slides/slide${idx}.xml`] = strToU8(slideXml(cx, cy));
    files[`ppt/slides/_rels/slide${idx}.xml.rels`] = strToU8(slideRelsXml(idx, ext));
    onProgress?.({ phase: 'package', current: idx, total: n });
  }

  const zipped = await zipAsync(files, { level: 6 });
  return new Blob([zipped], {
    type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
  });
}

function contentTypesXml(n, ext, mime) {
  const slides = Array.from({ length: n }, (_, i) =>
    `<Override PartName="/ppt/slides/slide${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`
  ).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="${ext}" ContentType="${mime}"/>
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>
<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>
<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>
<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>
${slides}
</Types>`;
}

function topRelsXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/>
</Relationships>`;
}

function presentationXml(n, cx, cy) {
  const ids = Array.from({ length: n }, (_, i) =>
    `<p:sldId id="${256 + i}" r:id="rId${i + 2}"/>`
  ).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>
<p:sldIdLst>${ids}</p:sldIdLst>
<p:sldSz cx="${cx}" cy="${cy}"/>
<p:notesSz cx="6858000" cy="9144000"/>
</p:presentation>`;
}

function presentationRelsXml(n) {
  const slideRels = Array.from({ length: n }, (_, i) =>
    `<Relationship Id="rId${i + 2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${i + 1}.xml"/>`
  ).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>
${slideRels}
<Relationship Id="rId${n + 2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>
</Relationships>`;
}

function slideXml(cx, cy) {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
<p:cSld><p:spTree>
<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>
<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>
<p:pic>
<p:nvPicPr><p:cNvPr id="2" name="Picture"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr>
<p:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></p:blipFill>
<p:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr>
</p:pic>
</p:spTree></p:cSld>
</p:sld>`;
}

function slideRelsXml(idx, ext) {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image${idx}.${ext}"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>
</Relationships>`;
}

function slideMasterXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
<p:cSld><p:bg><p:bgRef idx="1001"><a:schemeClr val="bg1"/></p:bgRef></p:bg>
<p:spTree>
<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>
<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>
</p:spTree></p:cSld>
<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>
<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst>
</p:sldMaster>`;
}

function slideMasterRelsXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/>
</Relationships>`;
}

function slideLayoutXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sldLayout xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" type="blank" preserve="1">
<p:cSld name="Blank"><p:spTree>
<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>
<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>
</p:spTree></p:cSld>
<p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr>
</p:sldLayout>`;
}

function slideLayoutRelsXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="../slideMasters/slideMaster1.xml"/>
</Relationships>`;
}

function themeXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" name="Office Theme">
<a:themeElements>
<a:clrScheme name="Office">
<a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1>
<a:lt1><a:sysClr val="window" lastClr="FFFFFF"/></a:lt1>
<a:dk2><a:srgbClr val="1F497D"/></a:dk2>
<a:lt2><a:srgbClr val="EEECE1"/></a:lt2>
<a:accent1><a:srgbClr val="4F81BD"/></a:accent1>
<a:accent2><a:srgbClr val="C0504D"/></a:accent2>
<a:accent3><a:srgbClr val="9BBB59"/></a:accent3>
<a:accent4><a:srgbClr val="8064A2"/></a:accent4>
<a:accent5><a:srgbClr val="4BACC6"/></a:accent5>
<a:accent6><a:srgbClr val="F79646"/></a:accent6>
<a:hlink><a:srgbClr val="0000FF"/></a:hlink>
<a:folHlink><a:srgbClr val="800080"/></a:folHlink>
</a:clrScheme>
<a:fontScheme name="Office">
<a:majorFont><a:latin typeface="Calibri"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont>
<a:minorFont><a:latin typeface="Calibri"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont>
</a:fontScheme>
<a:fmtScheme name="Office">
<a:fillStyleLst>
<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>
<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>
<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>
</a:fillStyleLst>
<a:lnStyleLst>
<a:ln w="9525" cap="flat" cmpd="sng" algn="ctr"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln>
<a:ln w="25400" cap="flat" cmpd="sng" algn="ctr"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln>
<a:ln w="38100" cap="flat" cmpd="sng" algn="ctr"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln>
</a:lnStyleLst>
<a:effectStyleLst>
<a:effectStyle><a:effectLst/></a:effectStyle>
<a:effectStyle><a:effectLst/></a:effectStyle>
<a:effectStyle><a:effectLst/></a:effectStyle>
</a:effectStyleLst>
<a:bgFillStyleLst>
<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>
<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>
<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>
</a:bgFillStyleLst>
</a:fmtScheme>
</a:themeElements>
</a:theme>`;
}

// ════════════════════════════════════════════════════════════════════════
// UI wiring
// ════════════════════════════════════════════════════════════════════════

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const fileInfo = document.getElementById('fileInfo');
const convertBtn = document.getElementById('convertBtn');
const formatToggle = document.getElementById('formatToggle');
const scaleSlider = document.getElementById('scaleSlider');
const scaleValue = document.getElementById('scaleValue');
const qualitySlider = document.getElementById('qualitySlider');
const qualityValue = document.getElementById('qualityValue');
const qualityRow = document.getElementById('qualityRow');
const progress = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const results = document.getElementById('results');
const stats = document.getElementById('stats');
const downloadLink = document.getElementById('downloadLink');

let selectedFile = null;
let selectedFormat = 'png';
let currentDownloadUrl = null;

function formatBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1024 / 1024).toFixed(2)} MB`;
}

function setFile(file) {
  if (!file || file.type !== 'application/pdf') {
    alert('Please choose a PDF file.');
    return;
  }
  selectedFile = file;
  fileInfo.classList.add('visible');
  fileInfo.textContent = `${file.name} — ${formatBytes(file.size)}`;
  convertBtn.disabled = false;
}

fileInput.addEventListener('change', (e) => setFile(e.target.files[0]));

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragging');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragging');
  setFile(e.dataTransfer.files[0]);
});

formatToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  formatToggle.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');
  selectedFormat = btn.dataset.format;
  qualityRow.classList.toggle('disabled', selectedFormat !== 'jpeg');
});

scaleSlider.addEventListener('input', () => {
  const s = parseFloat(scaleSlider.value);
  scaleValue.textContent = `${s}× (≈${Math.round(72 * s)} DPI)`;
});

qualitySlider.addEventListener('input', () => {
  qualityValue.textContent = parseFloat(qualitySlider.value).toFixed(2);
});

convertBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  convertBtn.disabled = true;
  progress.classList.add('visible');
  results.classList.remove('visible', 'error');
  if (currentDownloadUrl) URL.revokeObjectURL(currentDownloadUrl);

  const scale = parseFloat(scaleSlider.value);
  const quality = parseFloat(qualitySlider.value);
  const inputSize = selectedFile.size;
  const t0 = performance.now();

  try {
    const blob = await pdfToPptx(selectedFile, {
      scale,
      format: selectedFormat,
      quality,
      onProgress: ({ phase, current, total }) => {
        const pct = (current / total) * 100;
        // Render phase 0-70%, package phase 70-100%
        const adjusted = phase === 'render' ? pct * 0.7 : 70 + pct * 0.3;
        progressBar.style.width = `${adjusted}%`;
        progressText.textContent = `${phase}: page ${current}/${total}`;
      },
    });

    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
    const outName = selectedFile.name.replace(/\.pdf$/i, '') + '.pptx';
    currentDownloadUrl = URL.createObjectURL(blob);
    downloadLink.href = currentDownloadUrl;
    downloadLink.download = outName;

    const ratio = (blob.size / inputSize).toFixed(2);
    const sizeChange = blob.size > inputSize
      ? `${ratio}× larger than PDF`
      : `${(1 / ratio).toFixed(2)}× smaller than PDF`;

    stats.textContent =
      `Output: ${outName}\n` +
      `Size:   ${formatBytes(blob.size)} (${sizeChange})\n` +
      `Format: ${selectedFormat.toUpperCase()}${selectedFormat === 'jpeg' ? ` @ q${quality}` : ''}\n` +
      `Scale:  ${scale}× (≈${Math.round(72 * scale)} DPI)\n` +
      `Time:   ${elapsed}s`;
    results.classList.add('visible');
    progressText.textContent = 'Done.';
  } catch (err) {
    console.error(err);
    stats.textContent = `Error: ${err.message || err}\n\nCheck the browser console for details.`;
    results.classList.add('visible', 'error');
    downloadLink.style.display = 'none';
  } finally {
    convertBtn.disabled = false;
  }
});
</script>
</body>
</html>
